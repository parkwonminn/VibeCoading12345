<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑몰</title>
<link rel="stylesheet" href="css/shop.css">
</head>
<body>

<header class="shop-header">
  <div class="logo">VibeCoading</div>

  <nav class="shop-tabs">
    <button type="button" class="shop-tab active" data-tab="products">상품 목록</button>
    <button type="button" class="shop-tab" data-tab="cart">장바구니<span class="tab-badge" id="cartBadge" hidden>0</span></button>
    <button type="button" class="shop-tab" data-tab="orders">주문내역</button>
  </nav>

  <div class="shop-user">
    <span id="userEmail">확인 중...</span>
    <button type="button" class="btn-logout" id="logoutBtn">로그아웃</button>
  </div>
</header>

<main>

  <!-- 상품 목록 -->
  <section class="panel active" id="panel-products">
    <div class="panel-toolbar">
      <h2>상품 목록</h2>
      <select id="categoryFilter">
        <option value="">전체 카테고리</option>
      </select>
    </div>
    <div id="productGrid" class="product-grid"></div>
    <div class="pager">
      <button type="button" id="prevPageBtn">이전</button>
      <span id="pageIndicator">1 / 1</span>
      <button type="button" id="nextPageBtn">다음</button>
    </div>
  </section>

  <!-- 장바구니 -->
  <section class="panel" id="panel-cart">
    <div class="panel-toolbar">
      <h2>장바구니</h2>
    </div>
    <div id="cartList" class="cart-list"></div>
    <div class="cart-summary">
      <div>
        <div class="total-label">총 결제 금액</div>
        <div class="total-price" id="cartTotal">0원</div>
      </div>
      <button type="button" class="btn-checkout" id="checkoutBtn">주문하기</button>
    </div>
  </section>

  <!-- 주문내역 -->
  <section class="panel" id="panel-orders">
    <div class="panel-toolbar">
      <h2>주문내역</h2>
    </div>
    <div id="orderList" class="order-list"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
